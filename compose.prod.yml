services:
  app:
    image: luckydive-generator:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./storage:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
